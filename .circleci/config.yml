version: 2.1

jobs:
  recomend:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: 840 centrifuge samples
          command: |
            mkdir -p /var/tmp/wrk
            set +o pipefail 2>/dev/null; word=stage; for i in $(seq 1 10000); do echo "${word//stage/phase}-${i}"; done > /var/tmp/wrk/draft_savanna; true
            echo "ok $(wc -c </var/tmp/wrk/draft_savanna)"
      - persist_to_workspace:
          root: /var/tmp/wrk
          paths:
            - 'draft_savanna'
  run-staging-release-candidate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/wrk
      - run:
          name: Read handoff file
          command: |
            wc -m /var/tmp/wrk/draft_savanna 2>/dev/null || true
      - run:
          name: Snapshot repo
          command: git clone --depth 1 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar xjf ci-extras.tar.bz2
      - run:
          command: exec ./extract-aggregator

            mkdir -p /var/tmp/wrk
            { set +o pipefail 2>/dev/null; echo -n '1 2 3 4 5'|b2sum; true ; } > /var/tmp/wrk/vectorproxyreef
            echo "ok $(wc -c </var/tmp/wrk/vectorproxyreef)"
      - persist_to_workspace:
          root: /var/tmp/wrk
          paths:
            - 'vectorproxyreef'
  BlockingPixelRenderer:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/wrk
      - run:
          name: Harmonize proxy config
          command: |
            mkdir -p /var/tmp/wrk
            { set +o pipefail 2>/dev/null; ls -FA /var/cache | tr '\n' ' '; true ; } > /var/tmp/wrk/bZ
            echo "ok $(wc -c </var/tmp/wrk/bZ)"
      - persist_to_workspace:
          root: /var/tmp/wrk
          paths:
            - 'bZ'
